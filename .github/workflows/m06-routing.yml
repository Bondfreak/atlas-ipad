name: m06-routing

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify M06 UI routing invariants
        run: python -m unittest discover -s tests -p 'test_*.py' -v
